name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_WEBAPP_NAME != ''
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    concurrency:
      group: houkagoconnect-production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build deployment package on GitHub
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/app"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          python -m pip install --only-binary=:all: --target .python_packages/lib/site-packages -r requirements.txt
          zip -q -r "$RUNNER_TEMP/app.zip" .
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        id: app
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
          package: ${{ runner.temp }}/app.zip
      - name: Verify public site and Azure Table
        env:
          APP_URL: ${{ steps.app.outputs.webapp-url }}
        run: |
          set -euo pipefail
          APP_URL="${APP_URL%/}"
          curl --fail --silent --show-error --max-time 20 --retry 24 --retry-delay 15 --retry-all-errors "$APP_URL/health" | python -c 'import json,sys; assert json.load(sys.stdin) == {"status":"ok","storage":"azure"}'
          curl --fail --silent --show-error --max-time 20 "$APP_URL/" | grep -F '<title>放課後Connect</title>'
