{% extends 'base.html' %}
{% block title %}新規投稿 · 放課後Connect{% endblock %}
{% block content %}
<a class="back" href="{{ url_for('index') }}">← 投稿一覧</a>
<section class="card">
  <h1>新規投稿</h1>
  <p>名前の入力は不要です。学校名・本名・連絡先や、個人が特定できる画像は載せないでください。</p>
  <form class="stack" method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>カテゴリ<select name="category" required>
      <option value="">選んでください</option>
      {% for key, label in categories.items() %}<option value="{{ key }}">{{ label }}</option>{% endfor %}
    </select></label>
    <label>タイトル<input name="title" maxlength="80" required placeholder="何について話したい？"></label>
    <label>本文<textarea name="body" rows="7" maxlength="2000" required placeholder="質問や話したいことを書こう"></textarea></label>
    <label>画像（任意、5 MB まで）<input id="upload" name="image" type="file" accept="image/jpeg,image/png,image/webp"></label>
    <p id="file-status" role="status"></p>
    <button type="submit">匿名で投稿する</button>
  </form>
</section>
{% endblock %}
